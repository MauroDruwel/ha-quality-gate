name: Reusable Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for pytest"
        type: string
        default: "3.13"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -c "import json, glob; [print(r) for p in glob.glob('custom_components/*/manifest.json') for r in json.load(open(p)).get('requirements', [])]" | while read -r req; do
            if [ -n "$req" ]; then
              pip install "$req"
            fi
          done
      - name: Run tests
        run: pytest
